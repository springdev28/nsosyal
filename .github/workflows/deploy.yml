name: Deploy to Hostinger

# nSosyal 5N1K bir Next.js sunucu uygulamasidir: her rota sunucuda render edilir
# ve butun yazma yollari Server Action'lardan gecer. Bu yuzden statik/PHP
# barindirma yeterli degildir; hedef Node calistirabilen bir Hostinger plani
# (VPS ya da Node.js hosting) olmak zorunda.
#
# Kimlik bilgileri depoda DURMAZ. Dort repository secret gerekir:
#   HOSTINGER_HOST      sunucu adresi        (or. 123.45.67.89 veya vps.example.com)
#   HOSTINGER_USER      SSH kullanicisi
#   HOSTINGER_SSH_KEY   ozel anahtar (PEM icerigi)
#   HOSTINGER_PATH      sunucudaki uygulama dizini (or. /home/user/nsosyal)
# Istege bagli:
#   HOSTINGER_PORT      SSH portu (varsayilan 22)
#   HOSTINGER_HEALTH_URL  dagitim sonrasi kontrol edilecek adres

on:
  push:
    branches: [main]
  # Elle tetikleme: bir dagitimi yeniden calistirmak icin.
  workflow_dispatch:

# Ust uste gelen dagitimlar birbirini ezmesin.
#
# `cancel-in-progress: false` kuyruk olusturuyordu: yeni bir push, onceki
# kosunun ~12 dakikalik test paketinin arkasinda bekliyor ve geri bildirim
# gecikiyordu. Dagitim hattinda eskimis bir commit'i yayina almanin degeri
# zaten yok; yeni kosu eskisini iptal eder.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  # Sunucu erisimi testlerden ONCE ve onlarla PARALEL denetlenir.
  #
  # Onceki duzende dagitim tam test paketinin arkasindaydi: eksik bir secret ya
  # da sunucuya konmamis bir anahtar ancak ~12 dakika sonra ortaya cikiyordu.
  # Kimlik bilgisi sorunu kodla ilgili degil; kod testlerini beklemesi icin bir
  # sebep yok. Bu is saniyeler icinde biter ve sorunu adiyla soyler.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
    steps:
      - name: Check deploy secrets
        id: secrets
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          TARGET_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          missing=""
          [ -z "$HOST" ] && missing="$missing HOSTINGER_HOST"
          [ -z "$SSH_USER" ] && missing="$missing HOSTINGER_USER"
          [ -z "$KEY" ] && missing="$missing HOSTINGER_SSH_KEY"
          [ -z "$TARGET_PATH" ] && missing="$missing HOSTINGER_PATH"

          # Hic secret yoksa Hostinger bu depo icin yapilandirilmamis demektir.
          # Bu bir hata degil bir tercih: proje su an Render uzerinde yayinda.
          # Her push'ta kirmizi yanan bir is akisi zamanla tamamen goz ardi
          # edilir; asil bir sorun ciktiginda da kimse fark etmez.
          if [ -z "$HOST" ] && [ -z "$SSH_USER" ] && [ -z "$KEY" ] && [ -z "$TARGET_PATH" ]; then
            echo "Hostinger secret'lari tanimli degil; dagitim atlaniyor."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Bazilari var bazilari yoksa bu yarim kalmis bir kurulumdur ve
          # sessizce gecilmemeli.
          if [ -n "$missing" ]; then
            echo "::error::Hostinger kismen yapilandirilmis. Eksik:$missing"
            echo "Ayrintili kurulum: docs/deployment.md"
            exit 1
          fi

          echo "Dort zorunlu secret de tanimli."
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # Anahtarin sunucuda GERCEKTEN calistigini burada ogreniyoruz. Secret'in
      # dolu olmasi yetmez: acik anahtar authorized_keys'te degilse dagitim
      # yine duser, ama bu kez sebebini bilerek.
      - name: Verify server access
        if: steps.secrets.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          TARGET_PATH: ${{ secrets.HOSTINGER_PATH }}
        run: |
          port="${PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if ! ssh-keyscan -p "$port" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::$HOST:$port adresine ulasilamadi. HOSTINGER_HOST dogru mu? (yalnizca IP/alan adi, https:// ve port olmadan)"
            exit 1
          fi

          if ! ssh -i ~/.ssh/id_deploy -p "$port" -o BatchMode=yes -o ConnectTimeout=15 \
                 "$SSH_USER@$HOST" 'echo baglanti-tamam'; then
            echo "::error::SSH kimlik dogrulamasi basarisiz. Ozel anahtar secret'ta, ama ACIK anahtar sunucuda authorized_keys icinde olmayabilir."
            echo "Cozum: ssh-copy-id -i ~/.ssh/nsosyal_deploy.pub $SSH_USER@$HOST"
            echo "veya hPanel > VPS > SSH Keys altina .pub dosyasinin icerigini yapistirin."
            exit 1
          fi

          # Hedef dizin ve calisma zamani da simdi kontrol edilsin; dagitim
          # sirasinda ortaya cikmasindansa burada cikmasi daha ucuz.
          ssh -i ~/.ssh/id_deploy -p "$port" -o BatchMode=yes "$SSH_USER@$HOST" "
            set -e
            [ -d '$TARGET_PATH' ] || { echo '::error::HOSTINGER_PATH sunucuda yok: $TARGET_PATH'; exit 1; }
            command -v node >/dev/null || { echo '::error::Sunucuda node bulunamadi'; exit 1; }
            command -v pm2  >/dev/null || { echo '::error::Sunucuda pm2 bulunamadi (npm i -g pm2)'; exit 1; }
            echo \"node \$(node -v) / pm2 hazir\"
          "

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Kirik bir surum dagitilmasin: typecheck + lint + birim testleri.
      - run: npm run verify

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

  deploy:
    name: Deploy
    needs: [preflight, verify]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.HOSTINGER_PORT || 22 }}" -H "${{ secrets.HOSTINGER_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null

      # Yalnizca calistirmak icin gerekenler gonderilir. node_modules
      # gonderilmez; sunucuda uretim bagimliliklari ayrica kurulur.
      - name: Upload build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ secrets.HOSTINGER_PORT || 22 }}" \
            --exclude '.git' \
            .next public package.json package-lock.json next.config.ts \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PATH }}/"

      - name: Install and restart
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.HOSTINGER_PORT || 22 }}" \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            "set -e
             cd '${{ secrets.HOSTINGER_PATH }}'
             npm ci --omit=dev
             # pm2 uygulamayi ayakta tutar ve sunucu yeniden baslayinca geri getirir.
             if pm2 describe nsosyal >/dev/null 2>&1; then
               pm2 reload nsosyal --update-env
             else
               pm2 start npm --name nsosyal -- start
               pm2 save
             fi"

      # Dagitimin gercekten ayakta oldugunu dogrula. Adres verilmemisse atlanir.
      #
      # Kosul `if:` icinde DEGIL, betigin icinde: GitHub `secrets` baglamini
      # if ifadelerinde kabul etmiyor ve is akisini daha ayristirma asamasinda
      # reddediyor (hic job uretmeden). Secret'i env'e alip burada kontrol
      # ediyoruz.
      - name: Health check
        env:
          HEALTH_URL: ${{ secrets.HOSTINGER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HOSTINGER_HEALTH_URL tanimli degil; saglik kontrolu atlandi."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$HEALTH_URL" | grep -q '"status":"ok"'; then
              echo "Saglik kontrolu gecti."
              exit 0
            fi
            echo "Deneme $attempt basarisiz, tekrar denenecek..."
            sleep 5
          done
          echo "Saglik kontrolu gecmedi."
          exit 1

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy
