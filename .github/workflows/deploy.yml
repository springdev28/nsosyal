name: Deploy to Hostinger

# nSosyal 5N1K bir Next.js sunucu uygulamasidir: her rota sunucuda render edilir
# ve butun yazma yollari Server Action'lardan gecer. Bu yuzden statik/PHP
# barindirma yeterli degildir; hedef Node calistirabilen bir Hostinger plani
# (VPS ya da Node.js hosting) olmak zorunda.
#
# Kimlik bilgileri depoda DURMAZ. Dort repository secret gerekir:
#   HOSTINGER_HOST      sunucu adresi        (or. 123.45.67.89 veya vps.example.com)
#   HOSTINGER_USER      SSH kullanicisi
#   HOSTINGER_SSH_KEY   ozel anahtar (PEM icerigi)
#   HOSTINGER_PATH      sunucudaki uygulama dizini (or. /home/user/nsosyal)
# Istege bagli:
#   HOSTINGER_PORT      SSH portu (varsayilan 22)
#   HOSTINGER_HEALTH_URL  dagitim sonrasi kontrol edilecek adres

on:
  push:
    branches: [main]
  # Elle tetikleme: bir dagitimi yeniden calistirmak icin.
  workflow_dispatch:

# Ust uste gelen dagitimlar birbirini ezmesin.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Kirik bir surum dagitilmasin: typecheck + lint + birim testleri.
      - run: npm run verify

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Eksik secret'ta hata ssh-keyscan'in icinden, anlasilmaz bicimde geliyordu.
      # Once acikca kontrol edip hangi secret'in eksik oldugunu yaziyoruz.
      - name: Check deploy secrets
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          PATH_ON_SERVER: ${{ secrets.HOSTINGER_PATH }}
        run: |
          missing=""
          [ -z "$HOST" ] && missing="$missing HOSTINGER_HOST"
          [ -z "$USER" ] && missing="$missing HOSTINGER_USER"
          [ -z "$KEY" ] && missing="$missing HOSTINGER_SSH_KEY"
          [ -z "$PATH_ON_SERVER" ] && missing="$missing HOSTINGER_PATH"
          if [ -n "$missing" ]; then
            echo "::error::Dagitim yapilamadi. Tanimli olmayan secret'lar:$missing"
            echo ""
            echo "Bunlari su adrese ekleyin:"
            echo "  Settings > Secrets and variables > Actions > New repository secret"
            echo ""
            echo "Ayrintili kurulum: docs/deployment.md"
            echo ""
            echo "NOT: Derleme ve butun testler GECTI; eksik olan yalnizca sunucu erisimi."
            exit 1
          fi
          echo "Dort zorunlu secret de tanimli."

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.HOSTINGER_PORT || 22 }}" -H "${{ secrets.HOSTINGER_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null

      # Yalnizca calistirmak icin gerekenler gonderilir. node_modules
      # gonderilmez; sunucuda uretim bagimliliklari ayrica kurulur.
      - name: Upload build
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ secrets.HOSTINGER_PORT || 22 }}" \
            --exclude '.git' \
            .next public package.json package-lock.json next.config.ts \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PATH }}/"

      - name: Install and restart
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.HOSTINGER_PORT || 22 }}" \
            "${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }}" \
            "set -e
             cd '${{ secrets.HOSTINGER_PATH }}'
             npm ci --omit=dev
             # pm2 uygulamayi ayakta tutar ve sunucu yeniden baslayinca geri getirir.
             if pm2 describe nsosyal >/dev/null 2>&1; then
               pm2 reload nsosyal --update-env
             else
               pm2 start npm --name nsosyal -- start
               pm2 save
             fi"

      # Dagitimin gercekten ayakta oldugunu dogrula. Adres verilmemisse atlanir.
      #
      # Kosul `if:` icinde DEGIL, betigin icinde: GitHub `secrets` baglamini
      # if ifadelerinde kabul etmiyor ve is akisini daha ayristirma asamasinda
      # reddediyor (hic job uretmeden). Secret'i env'e alip burada kontrol
      # ediyoruz.
      - name: Health check
        env:
          HEALTH_URL: ${{ secrets.HOSTINGER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HOSTINGER_HEALTH_URL tanimli degil; saglik kontrolu atlandi."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$HEALTH_URL" | grep -q '"status":"ok"'; then
              echo "Saglik kontrolu gecti."
              exit 0
            fi
            echo "Deneme $attempt basarisiz, tekrar denenecek..."
            sleep 5
          done
          echo "Saglik kontrolu gecmedi."
          exit 1

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy
